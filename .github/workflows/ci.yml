name: ShopFlow AI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Lint, Test & AI Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Cài đặt Dependencies
        run: npm ci

      - name: 🗄️ Sinh mã Prisma Client
        run: npm run prisma:generate

      - name: 🔍 Kiểm tra Kiểu dữ liệu & Cú pháp (TypeScript Lint)
        run: npm run lint

      - name: 🏗️ Biên dịch Production Bundle
        run: npm run build

      - name: 🛡️ Chạy Kiểm thử An ninh & Concurrency Stress Test
        run: npm run test:security

      - name: 🤖 Chạy Kiểm chuẩn 50 Ca Thử nghiệm AI Benchmark
        run: npm run test:benchmark

      - name: 🐳 Kiểm tra Đóng gói Docker Image
        run: docker build -t shopflow-ai:test .
